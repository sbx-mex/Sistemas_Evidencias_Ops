name: Azure Static Web Apps CI/CD

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  workflow_run:
    workflows: ["Actualizar Sistema de Evidencias OPS"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: azure-evidencias-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request') || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.sha }}
          submodules: false
          lfs: false

      - name: Preparar archivos web para Azure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p azure-public
          cp index.html styles.css app.js data-contract.js pdf-export.js xlsx-export.js service-worker.js manifest.webmanifest staticwebapp.config.json azure-public/
          cp -R assets exports azure-public/
          mkdir -p azure-public/data
          cp data/dashboard.json azure-public/data/
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('azure-public')
          config = json.loads((root / 'staticwebapp.config.json').read_text())
          assert any(r.get('route') == '/*' and r.get('allowedRoles') in (['evidencias_ops'], ['authenticated']) for r in config['routes']), 'Falta la restricción de acceso'
          json.loads((root / 'data/dashboard.json').read_text())
          assert not any((root / p).exists() for p in ('cms', 'scripts', 'tests', '.github', '.git', 'requirements.txt')), 'Se incluyeron archivos internos'
          print('Archivos web y control de acceso preparados.')
          PY

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SALMON_SEA_07FE94410 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "azure-public"
          api_location: ""
          output_location: ""
          skip_app_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_SALMON_SEA_07FE94410 }}
          action: "close"
