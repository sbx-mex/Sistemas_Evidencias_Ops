name: Actualizar Sistema de Evidencias OPS

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-dashboard.yml'
      - 'cms/*.xlsx'
      - 'assets/dm/**'
      - 'assets/icons/**'
      - 'assets/ui/**'
      - 'config/**'
      - 'scripts/**'
      - 'tests/**'
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'pdf-export.js'
      - 'xlsx-export.js'
      - 'service-worker.js'
      - 'manifest.webmanifest'
      - 'requirements.txt'

permissions:
  contents: write

concurrency:
  group: evidencias-ops-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: '1'
  PYTHONPYCACHEPREFIX: /tmp/evidencias-ops-pycache
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install --disable-pip-version-check -r requirements.txt
          pip check

      - name: Validar los tres motores Excel
        run: python -X utf8 scripts/validate_sources.py

      - name: Limpiar archivos obsoletos conocidos
        run: python scripts/clean_obsolete.py --apply

      - name: Reconstruir dashboard y exportaciones
        run: |
          set -euo pipefail
          python -X utf8 scripts/build_dashboard.py
          python -X utf8 scripts/export_excel.py
          python -X utf8 scripts/export_pdf.py

      - name: Validar sintaxis y controles del proyecto
        run: |
          set -euo pipefail
          python -X utf8 -m compileall -q scripts tests
          node --check app.js
          node --check pdf-export.js
          node --check xlsx-export.js
          git diff --check
          python -X utf8 scripts/clean_obsolete.py --check
          python -X utf8 tests/validate_dynamic_forms_schema.py
          python -X utf8 tests/validate_maintenance.py
          python -X utf8 tests/validate_project.py
          python -X utf8 scripts/audit_project.py

      - name: Resumen de actualización
        if: always()
        run: |
          echo "## Sistema de Evidencias OPS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Fuente: Excel Forms + Directorio + CMS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Excel: Forms + Directorio + CMS auditados de forma independiente" >> "$GITHUB_STEP_SUMMARY"
          echo "- Validación: UTF-8, fórmulas CMS, CeCo, actividad, evidencia y limpieza" >> "$GITHUB_STEP_SUMMARY"
          echo "- Publicación: sólo datos y exportaciones generadas" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar únicamente datos generados
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git add -- data/dashboard.json exports/Resumen_Evidencias_OPS.xlsx exports/Resumen_Evidencias_OPS.pdf
          git add -A -- config assets/dm assets/icons

          obsolete_test="tests/validate_horno_applicability.py"
          if git ls-files --error-unmatch "$obsolete_test" >/dev/null 2>&1 || test -e "$obsolete_test"; then
            git add -A -- "$obsolete_test"
          fi

          if git diff --cached --quiet; then
            echo "Los datos, exportaciones y limpieza ya están actualizados."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: actualizar evidencias OPS"
          git push
