name: Actualizar Sistema de Evidencias OPS

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-dashboard.yml'
      - '.github/workflows/azure-static-web-apps-salmon-sea-07fe94410.yml'
      - 'staticwebapp.config.json'
      - 'cms/*.xlsx'
      - 'assets/dm/**'
      - 'assets/director/**'
      - 'assets/about/**'
      - 'assets/icons/**'
      - 'assets/ui/**'
      - 'assets/campaign/**'
      - 'config/**'
      - 'scripts/**'
      - 'tests/**'
      - 'index.html'
      - 'styles.css'
      - 'app.js'
      - 'data-contract.js'
      - 'pdf-export.js'
      - 'xlsx-export.js'
      - 'service-worker.js'
      - 'manifest.webmanifest'
      - 'requirements.txt'
      # Detectar también copias obsoletas subidas por error a la raíz.
      # safe_maintenance elimina únicamente rutas de su lista controlada.
      - 'MANIFEST_CORRECCION_CMS_2026-09-22.txt'
      - 'Resumen_Evidencias_OPS.xlsx'
      - 'build_dashboard.py'
      - 'dashboard.json'
      - 'safe_maintenance.py'
      - 'validate_cutover.py'
      - 'validate_dynamic_forms_schema.py'
      - 'validate_project.py'
      - 'validate_safe_maintenance.py'
      - 'validate_sources_resilient.py'

permissions:
  contents: write
  pages: write

concurrency:
  group: evidencias-ops-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  PYTHONPYCACHEPREFIX: /tmp/evidencias-ops-pycache
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Preparar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependencias
        run: |
          pip install --disable-pip-version-check -r requirements.txt
          pip check

      - name: Validar los tres motores Excel
        run: python -X utf8 scripts/safe_maintenance.py --force

      - name: Validar sintaxis y controles del proyecto
        run: |
          set -euo pipefail
          python -X utf8 -m compileall -q scripts tests
          node --check app.js
          node --check data-contract.js
          node --check pdf-export.js
          node --check xlsx-export.js
          node --check service-worker.js
          node tests/validate_fhw_summary.js
          python -X utf8 tests/validate_publish_safe.py
          git diff --check
          python -X utf8 scripts/clean_obsolete.py --check

      - name: Publicar carga segura y eliminar obsoletos validados
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          python -X utf8 scripts/publish_safe.py

      - name: Actualizar GitHub Pages con los datos validados
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${{ github.repository }}/pages/builds"

      - name: Resumen de actualización
        if: always()
        env:
          BUILD_RESULT: ${{ job.status }}
        run: |
          echo "## Sistema de Evidencias OPS" >> "$GITHUB_STEP_SUMMARY"
          echo "- Resultado: $BUILD_RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo "- Fuente: Excel Forms + Directorio + CMS" >> "$GITHUB_STEP_SUMMARY"
          if [ "$BUILD_RESULT" = "success" ]; then
            echo "- 🟢 Carga segura: CMS, cruces, fechas, conteos, caché y exportaciones aprobados." >> "$GITHUB_STEP_SUMMARY"
            echo "- Limpieza: sólo lista controlada; eliminaciones de raíz, scripts y tests incluidas en el commit." >> "$GITHUB_STEP_SUMMARY"
            python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('data/dashboard.json').read_text(encoding='utf-8'))
          q, s = data['quality'], data['summary']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as report:
              report.write(f"- Validado en esta ejecución: {s['stores']} tiendas · {s['activities']} actividades · {s['completedCompletions']}/{s['expectedCompletions']} cumplimientos.\n")
              report.write(f"- Fecha de corte: {data['lastUpdatedDisplay']}.\n")
              report.write(f"- Filas aisladas: {len(q.get('quarantinedResponses', []))}; CeCo fuera del catálogo: {', '.join(q.get('unknownCeCos', [])) or 'ninguno'}.\n")
          PY
          else
            echo "- Actualización detenida. Revisar el primer paso con error antes de volver a ejecutar." >> "$GITHUB_STEP_SUMMARY"
          fi
